org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# mod options
mod_id=createdieselgenerators
mod_name=Create Diesel Generators
mod_version=1.3.15
maven_group=com.jesz.createdieselgenerators
archives_base_name=createdieselgenerators

# 26.1.2 Fabric port (see PORTING-26.1.md)
minecraft_version=26.1.2
java_version=25
loom_version=1.17.20
fabric_loader_version=0.20.1
fabric_api_version=0.155.3+26.1.2
forgeconfigapiport_version=26.1.5

# Create Fly (our fork at ../Create-Fly, built locally)
create_fly_jar=../Create-Fly/build/libs/create-fly-26.1.2-6.0.9-4.jar
create_fly_version_range=>=6.0.9-4

# CC:Tweaked 1.120.0 (Modrinth version id; compile-only, optional at runtime)
computercraft_tweaked_version=D9kw3xjO

# Moonlight Lib 26.1.2-4.3.0 (Modrinth version id; compile-only for the optional Every Compat wood type finder)
moonlight_version=HYd3L5kA

# JEI (compile-only, optional at runtime)
jei_version=29.47.0.109

# Jade (compile-only, optional at runtime)
jade_version=26.1.11+fabric

# Sable (Create Aeronautics port at ../create-aeronautics-fabric, module sable), compile-only for the optional
# Sable compat. Sable bundles Sable Companion (dev.ryanhcode.sable.companion).
sable_jar=../create-aeronautics-fabric/sable/build/libs/sable-fabric-26.1.2-2.0.3-fabric.26.1.2-port.jar
