plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${mod_version}+fabric-mc${minecraft_version}"
group = maven_group
base { archivesName = archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

loom {
    accessWidenerPath = file('src/main/resources/createdieselgenerators.accesswidener')
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
        java {
            // Datagen is stubbed (the committed src/generated/resources are used); see PORTING-26.1.md.
            exclude 'com/jesz/createdieselgenerators/events/datagen/**'
            // Compat for mods with no Fabric 26.1 build (KubeJS, Strut Your Stuff, Every Compat): see PORTING-26.1.md.
            exclude 'com/jesz/createdieselgenerators/compat/kubejs/**'
            exclude 'com/jesz/createdieselgenerators/compat/strut_your_stuff/**'
            exclude 'com/jesz/createdieselgenerators/compat/EveryCompatCompat.java'
            // TEMP: JEI compat is ported after the main code compiles.
            exclude 'com/jesz/createdieselgenerators/compat/jei/**'
        }
    }
}

dependencies {
    // 26.1 is unobfuscated: no mappings, and Loom no longer remaps (non-remap "fabric-loom" plugin).
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    implementation files(create_fly_jar)

    // Optional: CC:Tweaked peripherals (only touched when the mod is loaded)
    compileOnly "maven.modrinth:cc-tweaked:${computercraft_tweaked_version}"
    // Optional: compat/jei is only loaded by JEI itself via the jei_mod_plugin entrypoint.
    compileOnly "maven.modrinth:jei:${jei_version}"
    // Optional Sable compat, only touched when the "sable" mod is loaded (see PORTING-26.1.md)
    compileOnly files(sable_jar)

    // Used by the relocated Registrate port (com.jesz.createdieselgenerators.port.registrate)
    compileOnly "org.projectlombok:lombok:1.18.42"
    annotationProcessor "org.projectlombok:lombok:1.18.42"
}

processResources {
    // Hand-crafted resources take priority over datagen output (as upstream).
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def props = [
            version                   : project.version,
            minecraft_version         : minecraft_version,
            fabric_loader_version     : fabric_loader_version,
            fabric_api_version        : fabric_api_version,
            forgeconfigapiport_version: forgeconfigapiport_version,
            create_fly_version_range  : create_fly_version_range
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand props }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    from('LICENSE') { rename { "LICENSE_createdieselgenerators" } }
}
